<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Empower Academy — Tizimga kirish</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #eef2f9 0%, #dfe7f5 100%);
      padding: 20px;
    }
    .login-card {
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid #ffffff;
      border-radius: 28px;
      padding: 40px 36px;
      width: 100%;
      max-width: 430px;
      box-shadow: 0 20px 50px rgba(31, 45, 90, 0.08);
    }
    .brand { text-align: center; margin-bottom: 28px; }
    .brand img {
      max-height: 76px;
      width: auto;
      object-fit: contain;
      margin-bottom: 12px;
      border-radius: 12px;
    }
    .brand h1 { font-size: 24px; color: #1e293b; font-weight: 800; }
    .brand p { color: #64748b; font-size: 14px; margin-top: 6px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 7px; }
    input {
      width: 100%;
      padding: 13px 16px;
      border-radius: 14px;
      border: 1.5px solid #e2e8f0;
      background: #f8fafc;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }
    input:focus { border-color: #e11d48; background: #fff; box-shadow: 0 0 0 4px rgba(225, 29, 72, 0.1); }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #e11d48, #be123c);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 10px 25px rgba(225, 29, 72, 0.25);
    }
    .error-msg {
      color: #ef4444;
      background: #fef2f2;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <img src="/logo.jpg" alt="Empower Academy Logo" onerror="this.style.display='none'" />
      <h1>Xush kelibsiz</h1>
      <p>Shaxsiy kabinetga kirish uchun ma’lumotlarni kiriting</p>
    </div>

    <div id="errorBox" class="error-msg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label>Login (Username)</label>
        <input type="text" id="username" placeholder="Loginni kiriting" required />
      </div>
      <div class="form-group">
        <label>Parol</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>
      <button type="submit">Tizimga kirish</button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorBox = document.getElementById('errorBox');
      errorBox.style.display = 'none';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (!res.ok) {
          errorBox.textContent = data.error || 'Kirishda xatolik';
          errorBox.style.display = 'block';
          return;
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('role', data.role);
        localStorage.setItem('full_name', data.full_name || '');

        if (data.role === 'admin') {
          window.location.href = '/admin.html';
        } else if (data.role === 'teacher') {
          window.location.href = '/teacher.html';
        } else {
          window.location.href = '/student.html';
        }
      } catch (err) {
        errorBox.textContent = 'Serverga ulanib bo‘lmadi!';
        errorBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
